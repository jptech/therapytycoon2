name: Deploy to Pages

# The game is a static build with no server and no network calls, so publishing
# it is just "build and upload the folder". Runs on every push to main.
#
# This is the only workflow, on purpose. Tests, the balance harness and the
# browser suite are a local discipline — they are worth a person's attention on
# the change they just made, not a runner's on every push — so the one thing
# that happens here is the one thing that has to happen remotely. A build that
# does not compile still fails loudly, because publishing requires it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it — a half-deployed Pages site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Vite is configured with `base: './'`, so the bundle is path-agnostic and
      # works from the /therapytycoon2/ subpath Pages serves it from.
      - run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
