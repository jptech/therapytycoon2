name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Types, unit tests and the production build. Fast — the whole sim suite runs
  # in about a second because none of it touches a DOM.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  # The only layer that sees what a person sees. Every bug found by playing this
  # game was invisible to the two jobs above — see docs/TESTING.md.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        # Traces and screenshots are only interesting when something went wrong.
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The curves. A short sweep, because the point here is "did a change quietly
  # break the economy", not the full 40×200 run that belongs on a workstation.
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run balance -- --runs 8 --days 200 --difficulty cozy,standard,challenge --quiet
